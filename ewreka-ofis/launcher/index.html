<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ewreka Ofis</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:">
<link rel="icon" href="../shared/assets/app.svg">
<link rel="stylesheet" href="../shared/ewreka-shell.css">
<style>
  :root { --bg: #F4F4F6; --card: #fff; --line: #E4E4E9; --ink: #16161A; --dim: #6B6B76; --y: #FFC300; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; font: 14px/1.45 "Segoe UI Variable Text", "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; color: var(--ink); background: var(--bg); user-select: none; -webkit-user-select: none; }
  aside { width: 232px; flex: 0 0 232px; background: #141416; color: #ECECEF; display: flex; flex-direction: column; padding: 26px 16px 18px; position: relative; overflow: hidden; }
  aside::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--y); }
  aside .logo { height: 34px; align-self: flex-start; margin: 0 6px 30px; }
  aside nav { display: flex; flex-direction: column; gap: 4px; }
  aside nav button { display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border: 0; border-radius: 9px; background: transparent; color: inherit; font: inherit; cursor: pointer; text-align: left; }
  aside nav button:hover { background: #222227; }
  aside nav button.on { background: #26262c; box-shadow: inset 3px 0 0 var(--y); }
  aside nav svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  aside .grow { flex: 1; }
  aside .meta { font-size: 12px; color: #8A8A94; padding: 0 8px; line-height: 1.6; }
  aside .meta a { color: var(--y); text-decoration: none; cursor: pointer; }
  aside .bulb { position: absolute; right: -40px; bottom: 40px; width: 150px; opacity: .045; pointer-events: none; }
  main { flex: 1; min-width: 0; overflow: auto; padding: 38px 48px 40px; }
  h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -.015em; }
  .sub { color: var(--dim); margin: 0 0 28px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .09em; color: var(--dim); margin: 0 0 14px; font-weight: 700; }
  .tiles { display: grid; grid-template-columns: repeat(4, minmax(150px, 1fr)); gap: 16px; margin-bottom: 38px; }
  .tile { position: relative; display: flex; flex-direction: column; gap: 14px; padding: 20px; border-radius: 16px; border: 1px solid var(--line); background: var(--card); cursor: pointer; text-align: left; font: inherit; color: inherit; transition: transform .15s, box-shadow .15s, border-color .15s; overflow: hidden; }
  .tile::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 4px; background: var(--c); opacity: .9; }
  .tile:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(20,20,30,.08); border-color: color-mix(in srgb, var(--c) 45%, var(--line)); }
  .tile:focus-visible { outline: 2px solid var(--y); outline-offset: 2px; }
  .tile img { width: 58px; height: 58px; }
  .tile strong { font-size: 17px; display: block; }
  .tile span { color: var(--dim); font-size: 13px; }
  .tile em { font-style: normal; font-size: 12px; color: var(--c); font-weight: 600; margin-top: auto; }
  .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .row h2 { margin: 0; }
  .btn { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 9px; border: 1px solid var(--line); background: #fff; font: inherit; cursor: pointer; color: inherit; }
  .btn:hover { border-color: var(--y); }
  .btn.pri { background: var(--y); border-color: var(--y); font-weight: 600; }
  .btn svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .recent { background: #fff; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .recent .item { display: grid; grid-template-columns: 34px 1fr auto 30px; align-items: center; gap: 14px; padding: 11px 16px; border-bottom: 1px solid #EFEFF2; cursor: pointer; }
  .recent .item:last-child { border-bottom: 0; }
  .recent .item:hover { background: #FFF8E1; }
  .recent .item img { width: 30px; height: 30px; }
  .recent .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .recent .path { color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: rtl; text-align: left; }
  .recent .time { color: var(--dim); font-size: 12.5px; white-space: nowrap; }
  .recent .x { width: 28px; height: 28px; border: 0; background: transparent; border-radius: 6px; color: #9a9aa4; cursor: pointer; font-size: 16px; visibility: hidden; }
  .recent .item:hover .x { visibility: visible; }
  .recent .x:hover { background: #eee; color: #333; }
  .empty { padding: 34px; text-align: center; color: var(--dim); }
  .empty b { color: var(--ink); display: block; margin-bottom: 4px; font-size: 15px; }
  .drop { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(255,195,0,.14); border: 3px dashed var(--y); font-weight: 600; font-size: 20px; z-index: 10; }
  .drop.on { display: flex; }
  @media (max-width: 900px) { .tiles { grid-template-columns: repeat(2, 1fr); } aside { width: 190px; flex-basis: 190px; } main { padding: 28px; } }
</style>
</head>
<body>
<aside>
  <img class="logo" src="../shared/assets/logo-light.png" alt="ewreka digital">
  <nav>
    <button class="on" id="navHome"><svg viewBox="0 0 24 24"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/></svg>Giriş</button>
    <button id="navOpen"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v1"/><path d="M3 7v11a2 2 0 0 0 2 2h13.5a2 2 0 0 0 1.9-1.4L22 12H7.2a2 2 0 0 0-1.9 1.4L3 20"/></svg>Aç</button>
    <button id="navAbout"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>Hakkında</button>
  </nav>
  <div class="grow"></div>
  <div class="meta">Ewreka Ofis <span id="ver">1.0</span><br>Ücretsiz ve açık kaynak<br><a id="site">ewreka.net</a></div>
  <img class="bulb" src="../shared/assets/bulb.svg" alt="">
</aside>
<main>
  <h1 id="hello">İyi günler</h1>
  <p class="sub">Yeni bir belge oluşturun ya da kaldığınız yerden devam edin.</p>
  <h2>Yeni oluştur</h2>
  <div class="tiles">
    <button class="tile" data-m="nota" style="--c:#4C8DFF"><img src="../shared/assets/nota.svg" alt=""><div><strong>Nota</strong><span>Belge ve yazı</span></div><em>Boş belge →</em></button>
    <button class="tile" data-m="matrix" style="--c:#1FB177"><img src="../shared/assets/matrix.svg" alt=""><div><strong>Matrix</strong><span>Tablo ve hesaplama</span></div><em>Boş tablo →</em></button>
    <button class="tile" data-m="vista" style="--c:#F07A1A"><img src="../shared/assets/vista.svg" alt=""><div><strong>Vista</strong><span>Sunum ve slayt</span></div><em>Boş sunum →</em></button>
    <button class="tile" data-m="carta" style="--c:#F0435A"><img src="../shared/assets/carta.svg" alt=""><div><strong>Carta</strong><span>PDF görüntüle ve düzenle</span></div><em>Carta'yı aç →</em></button>
  </div>
  <div class="row"><h2>Son kullanılanlar</h2><button class="btn pri" id="openBtn"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v1"/><path d="M3 7v11a2 2 0 0 0 2 2h13.5a2 2 0 0 0 1.9-1.4L22 12H7.2a2 2 0 0 0-1.9 1.4L3 20"/></svg>Dosya aç</button></div>
  <div class="recent" id="recent"></div>
</main>
<div class="drop" id="drop">Açmak için dosyaları bırakın</div>
<script src="../shared/ewreka-shell.js"></script>
<script>
(function () {
  const br = window.ewreka && window.ewreka.isDesktop ? window.ewreka : null;
  const $ = (s) => document.querySelector(s);
  const hr = new Date().getHours();
  $('#hello').textContent = hr < 6 ? 'İyi geceler' : hr < 12 ? 'Günaydın' : hr < 18 ? 'İyi günler' : 'İyi akşamlar';
  const MOD = { docx: 'nota', xlsx: 'matrix', xlsm: 'matrix', csv: 'matrix', pptx: 'vista', pdf: 'carta' };

  document.querySelectorAll('.tile').forEach(t => t.addEventListener('click', () => {
    const m = t.dataset.m;
    if (br) br.openWindow(m); else location.href = `../modules/${m}/index.html`;
  }));
  const openAny = () => { if (br) br.openInApp({ anyModule: true }); else alert('Dosya açmak için ilgili uygulamayı seçin.'); };
  $('#openBtn').onclick = openAny; $('#navOpen').onclick = openAny;
  $('#navAbout').onclick = () => {
    // Hakkında penceresi için kabuğun iletişim kutusunu kullan
    const S = window.EwrekaShell; S.about();
  };
  $('#site').onclick = () => { const u = 'https://www.ewreka.net'; if (br) br.openExternal(u); else window.open(u); };
  if (br) br.info().then(i => { $('#ver').textContent = i.version; }).catch(() => {});

  function ago(t) {
    const s = (Date.now() - t) / 1000;
    if (s < 60) return 'Az önce';
    if (s < 3600) return Math.floor(s / 60) + ' dk önce';
    if (s < 86400) return Math.floor(s / 3600) + ' saat önce';
    if (s < 86400 * 2) return 'Dün';
    if (s < 86400 * 7) return Math.floor(s / 86400) + ' gün önce';
    return new Date(t).toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' });
  }
  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  async function renderRecent() {
    const box = $('#recent');
    const list = br ? await br.recent() : [];
    if (!list.length) { box.innerHTML = '<div class="empty"><b>Henüz dosya yok</b>Açtığınız ve kaydettiğiniz dosyalar burada görünecek. Dosyaları bu pencereye sürükleyip bırakarak da açabilirsiniz.</div>'; return; }
    box.innerHTML = list.slice(0, 20).map(r => `<div class="item" data-p="${esc(r.path)}" title="${esc(r.path)}">
      <img src="../shared/assets/${r.module}.svg" alt=""><div style="min-width:0"><div class="name">${esc(r.name)}</div><div class="path">${esc(r.path)}</div></div>
      <div class="time">${ago(r.time)}</div><button class="x" title="Listeden kaldır">×</button></div>`).join('');
    box.querySelectorAll('.item').forEach(it => it.addEventListener('click', async (e) => {
      const p = it.dataset.p;
      if (e.target.closest('.x')) { e.stopPropagation(); await br.removeRecent(p); renderRecent(); return; }
      br.openWindow(null, p);
    }));
  }
  renderRecent();
  window.addEventListener('focus', renderRecent);

  // Sürükle-bırak
  const drop = $('#drop'); let depth = 0;
  window.addEventListener('dragenter', (e) => { e.preventDefault(); depth++; drop.classList.add('on'); });
  window.addEventListener('dragleave', () => { depth = Math.max(0, depth - 1); if (!depth) drop.classList.remove('on'); });
  window.addEventListener('dragover', (e) => e.preventDefault());
  window.addEventListener('drop', (e) => {
    e.preventDefault(); depth = 0; drop.classList.remove('on');
    if (!br) return;
    const paths = Array.from(e.dataTransfer.files).map(f => br.getPathForFile(f)).filter(p => p && MOD[(p.split('.').pop() || '').toLowerCase()]);
    if (paths.length) br.openInApp({ paths });
  });
  // Kısayollar
  window.addEventListener('keydown', (e) => {
    const mod = e.metaKey || e.ctrlKey;
    if (mod && e.key.toLowerCase() === 'o') { e.preventDefault(); openAny(); }
  });
  if (br) br.onCommand((c) => { if (c === 'open') openAny(); if (c === 'about') window.EwrekaShell.about(); });
})();
</script>
</body>
</html>
