<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Ewreka Vista — Ewreka Ofis sunu düzenleyicisi" />
    <title>Ewreka Vista</title>
    <style>
      html, body { margin: 0; height: 100%; }
      body { display: flex; flex-direction: column; overflow: hidden; background: #f3f3f5; }
      body.ew-screening .ew-bar { display: none !important; }
      .first-screen-loading {
        position: fixed; inset: 0;
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        font-family: 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif;
      }
      .first-screen-loading-spinner {
        width: 36px; height: 36px;
        border: 3px solid #FF8A2A; border-top-color: transparent; border-radius: 50%;
        box-sizing: border-box; animation: spinner .8s linear infinite;
      }
      .first-screen-loading-text { margin-top: 20px; color: #6b6b73; font-size: 14px; }
      @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
    <script src="../../shared/ewreka-shell.js"></script>
  </head>
  <body>
    <div id="app">
      <div class="first-screen-loading">
        <div class="first-screen-loading-spinner"></div>
        <div class="first-screen-loading-text">Ewreka Vista yükleniyor…</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      document.oncontextmenu = e => e.preventDefault()
    </script>
  </body>
</html>
